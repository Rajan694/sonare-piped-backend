services:
    # Built from this directory, not 1337kavin/piped:latest: the published image predates
    # NewPipeExtractor's lockupViewModel playlist fix (27bbabc8), so every playlist and
    # album came back with an empty relatedStreams. build.gradle pins an extractor that
    # has the fix; `./runPiped.sh up` rebuilds whenever the source hash below changes.
    piped:
        build:
            context: .
            labels:
                sonare.src-hash: "${PIPED_SRC_HASH:-}"
        image: sonare-piped:local
        restart: unless-stopped
        ports:
            - "127.0.0.1:8090:8080"
        volumes:
            - ./config.properties:/app/config.properties
        depends_on:
            - postgres
            - piped-proxy
            - bg-helper
    # Serves the media URLs the frontend actually fetches. Without it PROXY_PART
    # points at a public instance, which returns 502 and breaks playback.
    # proxy and bg-helper are pinned by digest: :latest is republished without notice and
    # has changed under us before. To move on, pull the new :latest, test playback, then
    # copy its digest from `docker images --digests` here.
    piped-proxy:
        image: 1337kavin/piped-proxy@sha256:e10c9474fdea1ddf09267a57c24d25a8c20ffbd96ac356db4b71d821f898e702
        restart: unless-stopped
        ports:
            - "127.0.0.1:8091:8080"
    bg-helper:
        image: 1337kavin/bg-helper-server@sha256:be55faab8780599cd951206f73ad1ab5b33a2c1c148eaad7f7c2403e00561729
        restart: unless-stopped
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        volumes:
            - ./data/db:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=piped
            - POSTGRES_USER=piped
            # Development default; production must set PIPED_DB_PASSWORD (and the same value as
            # hibernate.connection.password in config.properties).
            - POSTGRES_PASSWORD=${PIPED_DB_PASSWORD:-changeme}
