name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - uses: actions/checkout@v5

      - name: set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
          cache: "gradle"
      # The task the Docker image builds (Dockerfile); `build` also ran upstream's test setup.
      - name: Build the server jar
        run: ./gradlew shadowJar
